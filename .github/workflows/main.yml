name: Build EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build C++ library
        shell: bash
        run: g++ -O2 -shared -static-libgcc -static-libstdc++ -o voice_dsp.dll effects.cpp

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --onefile --noconsole
          --name VoiceChanger --icon icon.ico
          --add-binary "voice_dsp.dll;."
          --add-data "icon.ico;."
          --collect-all sounddevice
          voice_changer.py

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceChanger
          path: dist/VoiceChanger.exe

      - name: Publish release (only for tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VoiceChanger.exe
